[workspace]
members = ["cargo:."]

# cargo-dist configuration - scoped deliberately to GitHub Releases archives
# (tarballs + checksums) and a shell installer for Linux only. This is NOT
# used for distro packaging: the Fedora COPR spec (packaging/fedora/) and the
# Arch PKGBUILD (packaging/arch/) both build from source independently and
# are not driven by dist in any way.
#
# Verified for real: generated by actually running `dist init -y --ci github
# -i shell -t x86_64-unknown-linux-gnu -t aarch64-unknown-linux-gnu` (dist
# 0.32.0, installed via `cargo install cargo-dist --locked`) against a
# scratch copy of this repo, then trimmed down from there. Two things worth
# flagging about that run:
#   - Despite passing only the two Linux `-t` targets, `dist init` still
#     populated the full default 5-platform matrix (macOS/Windows included)
#     in the generated file; the `targets` list below was hand-trimmed back
#     down to just the two Linux triples this project actually wants.
#   - `dist init` also ran `dist generate`, which wrote
#     `.github/workflows/release.yml`. That step was deliberately NOT
#     reproduced in this repo, since `.github/` is owned by other concurrent
#     work here - regenerating CI is left as a follow-up (run
#     `dist generate ci` once `.github/` ownership is settled).
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backend dist would generate workflows for (see note above: not yet
# applied in this repo)
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax) - Linux
# only, per this project's scope (no macOS/Windows releases)
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
