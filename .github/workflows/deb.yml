name: Debian package

# Runs once cargo-dist's release workflow (release.yml) has already created
# the GitHub Release, so `gh release upload` always has a release to attach
# to. Triggering on `push: tags` instead would race the two workflows.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Routed through env rather than interpolated directly into a `run:`
  # script: git tag names aren't restricted from containing shell
  # metacharacters, so this event field must be treated as untrusted input.
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: cargo deb --no-strip
      - name: Upload .deb to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" target/debian/*.deb --clobber
